<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Servis — Desktop & Mobilni pregled</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:#0D0F12;color:#fff;padding:28px;display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;justify-content:center;min-height:100vh}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:#8fb0e6}
  .desk{width:1100px;max-width:88vw;height:720px;border:1px solid #2A313A;border-radius:10px;overflow:hidden;background:#fff}
  .desk iframe{width:1280px;height:960px;border:0;transform:scale(.6);transform-origin:top left}
  .deskwrap{width:1100px;max-width:88vw;height:720px;overflow:hidden}
  .deskwrap iframe{width:1833px;height:1200px;border:0;transform:scale(.6);transform-origin:top left}
  .phone{width:390px;max-width:92vw;height:780px;border:12px solid #1b1f26;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative}
  .phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#1b1f26;border-radius:0 0 18px 18px;z-index:2}
  .phone iframe{width:390px;height:756px;border:0;display:block}
</style>
</head>
<body>
  <div class="col">
    <span class="lbl">DESKTOP · 1280px</span>
    <div class="deskwrap"><iframe src="Turbo Servis.dc.html" scrolling="yes"></iframe></div>
  </div>
  <div class="col">
    <span class="lbl">MOBILNI · 390px</span>
    <div class="phone"><iframe src="Turbo Servis.dc.html" scrolling="yes"></iframe></div>
  </div>
</body>
</html>
